<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Córdoba Geek</title>

    
    <script src="Js/main.js" ></script>
</head>

<body>
    <header>
        <h1>Córdoba Geek</h1>

        <p>
            Simulador de eventos geek de Córdoba
        </p>
    </header>

    <main>
        <!-- Aquí se mostrará el resultado de la reserva -->
        <p id="mensajeReserva"></p>

        <section>
            <h2>Eventos disponibles</h2>

            <div id="contenedorEventos"></div>
        </section>
    </main>

    <!-- Ventana emergente para realizar una reserva -->
    <dialog id="modalReserva">
        <form id="formularioReserva">
            <h2>Reservar entradas</h2>

            <p id="eventoSeleccionado"></p>

            <div>
                <label for="cantidadEntradas">
                    Cantidad de entradas
                </label>

                <input
                    type="number"
                    id="cantidadEntradas"
                    name="cantidadEntradas"
                    min="1"
                    value="1"
                    required
                >
            </div>

            <br>

            <div>
                <label for="nombreCliente">
                    Nombre y apellido
                </label>

                <input
                    type="text"
                    id="nombreCliente"
                    name="nombreCliente"
                    minlength="3"
                    required
                >
            </div>

            <br>

            <div>
                <label for="emailCliente">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="emailCliente"
                    name="emailCliente"
                    required
                >
            </div>

            <br>

            <div>
                <label for="telefonoCliente">
                    Teléfono
                </label>

                <input
                    type="tel"
                    id="telefonoCliente"
                    name="telefonoCliente"
                    minlength="8"
                    required
                >
            </div>

            <p id="errorFormulario"></p>

            <div>
                <button
                    type="button"
                    id="botonCancelar"
                >
                    Cancelar
                </button>

                <button type="submit">
                    Confirmar reserva
                </button>
            </div>
        </form>
    </dialog>
</body>
</html>
