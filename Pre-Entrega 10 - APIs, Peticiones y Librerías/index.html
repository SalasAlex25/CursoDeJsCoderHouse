<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cordoba Geek - API y Librerias</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>

<body>

    <header class="cabecera">
        <h1>Cordoba Geek</h1>
        <p>Simulador de eventos con carga remota y almacenamiento local</p>
        <p id="mensaje-asincronico" class="mensaje-asincronico" aria-live="polite"></p>
    </header>

    <main class="contenido">

        <section class="panel" aria-labelledby="titulo-formulario">
            <h2 id="titulo-formulario">Agregar evento</h2>

            <form id="formulario-evento" class="formulario">

                <div class="campo">
                    <label for="input-nombre">Nombre</label>
                    <input type="text" id="input-nombre" placeholder="Ej: Cosplay Fest" autocomplete="off">
                </div>

                <div class="campo">
                    <label for="input-categoria">Categoria</label>
                    <input type="text" id="input-categoria" placeholder="Ej: Anime" autocomplete="off">
                </div>

                <div class="campo">
                    <label for="input-precio">Precio ($)</label>
                    <input type="number" id="input-precio" placeholder="Ej: 4500" min="0">
                </div>

                <div class="campo">
                    <label for="input-cupos">Cupos</label>
                    <input type="number" id="input-cupos" placeholder="Ej: 100" min="1">
                </div>

                <button type="submit" class="boton boton-primario">
                    + Agregar evento
                </button>
            </form>

            <p id="feedback" class="mensaje" role="status" aria-live="polite"></p>
        </section>

        <section class="panel" aria-labelledby="titulo-listado">
            <div class="barra-busqueda">
                <h2 id="titulo-listado">Eventos guardados</h2>
                <input type="search" id="buscador" placeholder="Buscar por nombre o categoria..."
                    aria-label="Buscar eventos" autocomplete="off">
            </div>

            <div class="acciones-storage">
                <p id="contador-resultados" class="contador"></p>
                <button type="button" id="boton-vaciar" class="boton boton-peligro">
                    Vaciar eventos guardados
                </button>
            </div>

            <div id="contenedor-eventos" class="contenedor-eventos"></div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/main.js"></script>
</body>

</html>
